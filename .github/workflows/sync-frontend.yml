name: Sync Frontend

on:
  schedule:
    # 每天 UTC 16:30 = 北京 00:30（错开后端同步的 00:00）
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新构建部署（即使无更新）'
        required: false
        default: 'false'

concurrency:
  group: sync-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout sub-store-workers (for version marker)
        uses: actions/checkout@v4

      - name: Checkout Sub-Store-Front-End
        uses: actions/checkout@v4
        with:
          repository: sub-store-org/Sub-Store-Front-End
          path: front
          fetch-depth: 1

      - name: Get frontend version
        id: ver
        working-directory: front
        run: |
          V=$(node -p "require('./package.json').version")
          S=$(git rev-parse HEAD)
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "sha=$S" >> $GITHUB_OUTPUT
          echo "Frontend: $V ($S)"

      - name: Read last deployed
        id: last
        run: |
          if [ -f .frontend-sha ]; then
            echo "sha=$(cat .frontend-sha)" >> $GITHUB_OUTPUT
          else
            echo "sha=none" >> $GITHUB_OUTPUT
          fi

      - name: Check if update needed
        id: check
        run: |
          if [ "${{ steps.ver.outputs.sha }}" = "${{ steps.last.outputs.sha }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "No update needed"
          else
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "Update needed"
          fi

      - name: Setup pnpm
        if: steps.check.outputs.needed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        if: steps.check.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install frontend deps
        if: steps.check.outputs.needed == 'true'
        working-directory: front
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        if: steps.check.outputs.needed == 'true'
        working-directory: front
        run: npx vite build

      - name: Generate wrangler config
        if: steps.check.outputs.needed == 'true'
        run: |
          mkdir -p front-worker
          cat > front-worker/wrangler.toml <<'TOML'
          name = "sub-store-front"
          compatibility_date = "2024-09-23"

          [assets]
          directory = "../front/dist"
          not_found_handling = "single-page-application"
          TOML
          sed -i 's/^          //' front-worker/wrangler.toml
          cat front-worker/wrangler.toml

      - name: Deploy frontend
        if: steps.check.outputs.needed == 'true'
        working-directory: front-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy

      - name: Update frontend marker
        if: steps.check.outputs.needed == 'true'
        run: |
          echo "${{ steps.ver.outputs.sha }}" > .frontend-sha
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .frontend-sha
          git commit -m "chore: sync frontend to ${{ steps.ver.outputs.version }} [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push; then
              echo "marker pushed on attempt $i"
              exit 0
            fi
            echo "push rejected, retrying in 5s..."
            sleep 5
          done
          echo "::error::failed to push frontend marker after 3 attempts"
          exit 1

      - name: Job summary
        if: always() && steps.check.outputs.needed == 'true'
        run: |
          {
            echo "## Frontend 同步结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 前端版本 | \`${{ steps.ver.outputs.version }}\` |"
            echo "| 上次部署 SHA | \`${{ steps.last.outputs.sha }}\` |"
            echo "| 本次 SHA | \`${{ steps.ver.outputs.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
